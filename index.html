<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桐陰祭136-2信号システム</title>
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="Images/Favicon.jpg" type="image/jpeg">

    <!-- キャッシュ対策付きで外部SDKを読み込み -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=1.0.0"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js?v=1.0.0"></script>
    
    <style>
        :root {
            /* ★信号の色を変更したい時は、ここのカラーコードだけを書き換えてください */
            --signal-color: #ff6a00; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- ヘッダー --- */
        .app-header {
            background-color: #1e1e1e;
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d2d;
            height: 70px;
            z-index: 10;
            position: relative;
        }
        .role-display { font-size: 18px; font-weight: bold; }
        .btn-change-role {
            background-color: #444444; color: #fff; border: none;
            padding: 8px 16px; font-size: 14px; border-radius: 6px; cursor: pointer;
        }
        .btn-change-role:hover { background-color: #666666; }

        /* --- イースターエッグ画像 --- */
        #easter-egg-img {
            position: absolute;
            top: -85px; 
            right: 100%; 
            margin-right: 12px;
            width: 70px;
            height: 70px; 
            object-fit: contain;
            transition: top 0.4s ease-out; 
            z-index: 20;
        }

        /* --- 通知用の横帯 --- */
        #visitor-banner {
            width: 100%;
            height: 0;
            background-color: #0033cc;
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 5px;
            transition: height 0.2s ease, padding 0.2s ease;
            overflow: hidden;
            border-bottom: 2px solid #002288;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #visitor-banner.active {
            height: 55px;
            padding: 5px 0;
        }

        /* --- 画面コンテナ --- */
        .screen {
            display: none; flex: 1; width: 100%; height: calc(100vh - 70px);
        }
        .screen.active { display: flex; }

        /* --- 1. セットアップ画面 --- */
        #screen-setup {
            flex-direction: column; justify-content: center; align-items: center;
            background: #121212; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 100;
        }
        .setup-box {
            background-color: #1e1e1e; padding: 50px; border-radius: 12px;
            text-align: center; border: 2px solid #333; width: 90%; max-width: 500px;
        }
        .setup-title { font-size: 24px; margin-bottom: 30px; }
        .custom-dropdown {
            width: 100%; padding: 15px; font-size: 20px;
            background-color: #2a2a2a; color: #fff; border: 2px solid #555;
            border-radius: 8px; margin-bottom: 30px; cursor: pointer;
        }
        .btn-start {
            width: 100%; background-color: #0066ff; color: #fff; border: none;
            padding: 15px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-start:hover { background-color: #0055cc; }
        .btn-cancel {
            width: 100%; background-color: #444; color: #fff; border: none;
            padding: 15px; font-size: 18px; border-radius: 8px; cursor: pointer;
            display: none;
        }
        .btn-cancel:hover { background-color: #666; }

        /* --- 2. 受付・スタート 監視画面 --- */
        #screen-admin { flex-direction: column; padding: 15px; }
        .admin-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr); gap: 15px; flex: 1;
        }
        .status-cell {
            border: 3px solid #333; border-radius: 10px; display: flex;
            flex-direction: column; overflow: hidden; background-color: #1a1a1a;
        }
        .status-cell.border-red { border-color: #ff0000 !important; }
        
        .cell-header {
            background-color: #000; padding: 8px 0; text-align: center;
            font-size: 20px; font-weight: bold; border-bottom: 2px solid #333;
            position: relative; /* バッテリーバッジの配置基準 */
        }
        .battery-badge {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            border: 2px solid #ffffff; border-radius: 4px; padding: 2px 6px;
            font-size: 14px; font-weight: bold; background-color: #000;
            line-height: 1; display: none; /* 初期は非表示 */
        }
        .battery-low {
            color: #ff3333 !important; border-color: #ff3333 !important;
        }

        .cell-body {
            flex: 1; display: flex; justify-content: center; align-items: center;
            font-size: 40px; font-weight: bold;
        }
        
        .status-unconnected { background-color: #2a2a2a; color: #666666; }
        .status-preparing { background-color: #ffffff; color: #000000; }
        .status-ready { background-color: #0033cc; color: #ffffff; }
        
        /* 信号用ステータス色（変数を使用） */
        .status-light-on { background-color: var(--signal-color); color: #000000; }
        .status-light-off { background-color: #1a1a1a; color: #888888; }
        
        .status-emergency { animation: urgent-blink 0.8s infinite steps(1); }
        @keyframes urgent-blink {
            0%, 75% { background-color: #ff0000; color: #ffffff; }
            75.1%, 100% { background-color: #330000; color: #666666; }
        }
        
        .btn-action-header {
            background-color: #00ff33; color: #000; border: none;
            padding: 10px 40px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer;
        }

        /* --- 3. クライアント（場所1〜4・スタート操作）画面 --- */
        #screen-client { 
            padding: 20px; gap: 20px; align-items: center; 
            height: calc(100vh - 70px); transition: height 0.2s ease;
        }
        #visitor-banner.active + #screen-client { height: calc(100vh - 125px); }
        
        .client-btn {
            flex: 1; height: 80%; border: 4px solid #444; border-radius: 15px;
            font-size: 42px; font-weight: bold; cursor: pointer; display: flex;
            justify-content: center; align-items: center; opacity: 0.3; transition: 0.2s;
        }
        .client-btn.btn-preparing { background-color: #222; border-color: #555; }
        .client-btn.btn-ready { background-color: #0044cc; border-color: #0066ff; }
        .client-btn.btn-emergency { background-color: #550000; border-color: #ff0000; color: #ffb3b3; opacity: 0.7; }
        
        .client-btn.btn-preparing.active { 
            opacity: 1; background-color: #ffffff !important; color: #000000 !important;
            transform: scale(1.02); border: 6px solid #ffcc00; box-shadow: 0 0 25px rgba(255,255,255,0.4); 
        }
        .client-btn.btn-emergency.active {
            opacity: 1; background-color: #ff0000 !important; border-color: #ffffff !important;
            color: #ffffff !important; box-shadow: 0 0 30px rgba(255,0,0,0.8);
        }
        .client-btn.active { opacity: 1; transform: scale(1.02); border-width: 6px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        /* --- 4. 信号画面（出発信号・接近）--- */
        #screen-signal {
            width: 100%; height: calc(100vh - 70px);
            background-color: #121212; transition: background-color 0.3s;
        }
        /* 変数を使用 */
        #screen-signal.light-on { background-color: var(--signal-color) !important; }
        #screen-signal.emergency-blink { animation: urgent-blink 0.8s infinite steps(1); }

        /* --- 5. 管理者画面 --- */
        #screen-manager {
            padding: 30px; flex-direction: column; align-items: center; justify-content: flex-start;
            overflow-y: auto;
        }
        .manager-table {
            width: 100%; max-width: 1000px; border-collapse: collapse; margin-top: 20px;
        }
        .manager-table th, .manager-table td {
            border: 2px solid #444; padding: 15px; text-align: center; font-size: 20px; font-weight: bold;
        }
        .manager-table th { background-color: #222; }
        .manager-table th:nth-child(1) { width: 25%; }
        .manager-table th:nth-child(2) { width: 35%; }
        .manager-table th:nth-child(3) { width: 20%; }
        .manager-table th:nth-child(4) { width: 20%; }
        .manager-table td { background-color: #1a1a1a; }
        
        .badge-blue { background-color: #0033cc; color: #fff; padding: 8px 20px; border-radius: 6px; display: inline-block; }
        
        /* 信号用バッジデザイン（変数を使用） */
        .box-light-on { background-color: var(--signal-color); border: 2px solid var(--signal-color); color: #000; padding: 8px 0; border-radius: 6px; display: block; width: 100%; }
        .box-light-off { background-color: #121212; border: 2px solid #444; color: #888; padding: 8px 0; border-radius: 6px; display: block; width: 100%; }

        .mgr-badge { display: inline-block; padding: 8px 20px; border-radius: 6px; font-weight: bold; width: 80%; }
        .mgr-badge-preparing { background-color: #ffffff; color: #000000; }
        .mgr-badge-ready { background-color: #0033cc; color: #ffffff; }
        .mgr-badge-emergency { background-color: #ff0000; color: #ffffff; }
        .mgr-badge-unconnected { background-color: #2a2a2a; color: #666666; }

        /* 管理者用バッテリーバッジ */
        .mgr-battery-badge {
            display: inline-block;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: #000;
        }
        .mgr-battery-badge.battery-low {
            color: #ff3333;
            border-color: #ff3333;
        }

        /* 追放ボタン */
        .btn-evict {
            background-color: #ff3333; color: white; border: none;
            padding: 8px 16px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
            width: 100%;
        }
        .btn-evict:hover { background-color: #cc0000; }
        .btn-evict:disabled { background-color: #555; color: #888; cursor: not-allowed; }

    </style>
</head>
<body>

    <!-- 役割選択画面 -->
    <div id="screen-setup" class="screen active">
        <div class="setup-box">
            <h1 class="setup-title">端末の役割を設定してください</h1>
            <select id="role-select" class="custom-dropdown">
                <option value="">-- 選択してください --</option>
                <option value="受付">受付</option>
                <option value="スタート">スタート</option>
                <option value="場所1">場所 1</option>
                <option value="場所2">場所 2</option>
                <option value="場所3">場所 3</option>
                <option value="場所4">場所 4</option>
                <option value="出発信号">出発信号</option>
                <option value="接近">接近</option>
                <option value="管理者">《管理者》</option>
            </select>
            <button class="btn-start" onclick="startApp()">この役割で開始する</button>
            <button id="btn-cancel-setup" class="btn-cancel" onclick="cancelSetup()">キャンセル</button>
        </div>
    </div>

    <!-- ヘッダー -->
    <div class="app-header" id="app-header" style="display: none;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="Images/Favicon.jpg" alt="Icon" style="height: 40px; width: 40px; border-radius: 6px;">
            <div>
                <span style="color:#aaa; font-size:14px;">現在の役割: </span>
                <span id="header-role-name" class="role-display">未設定</span>
            </div>
        </div>

        <div id="header-action-space" style="flex: 1; display: flex; justify-content: center;"></div>
        
        <div style="position: relative; display: flex; align-items: center; height: 100%;">
            <img id="easter-egg-img" src="" alt="Secret Character">
            <button class="btn-change-role" onclick="openSetup()">役割を変更</button>
        </div>
    </div>

    <!-- 通知帯 -->
    <div id="visitor-banner">来客</div>

    <!-- 受付・スタート（監視）画面 -->
    <div id="screen-admin" class="screen">
        <div class="admin-grid" id="admin-grid-container">
            <!-- 動的生成 -->
        </div>
    </div>

    <!-- クライアント画面（場所1〜4・スタートボタン操作用） -->
    <div id="screen-client" class="screen">
        <div class="client-btn btn-preparing active" id="btn-status-preparing" onclick="updateStatus('準備中')">準備中</div>
        <div class="client-btn btn-ready" id="btn-status-ready" onclick="updateStatus('準備完了')">準備完了</div>
        <div class="client-btn btn-emergency" id="btn-status-emergency" onclick="updateStatus('非常')">非常</div>
    </div>

    <!-- 信号（出発信号・接近）画面 -->
    <div id="screen-signal" class="screen"></div>

    <!-- 管理者画面 -->
    <div id="screen-manager" class="screen">
        <h2 style="font-size:28px; margin-bottom:10px;">全体状況監視（管理者）</h2>
        <table class="manager-table">
            <thead>
                <tr><th>役割</th><th>現在の状態</th><th>バッテリ</th><th>操作</th></tr>
            </thead>
            <tbody>
                <tr><td>受付</td><td id="mgr-受付">-</td><td id="mgr-batt-受付">-</td><td>-</td></tr>
                <tr><td>スタート</td><td id="mgr-スタート">-</td><td id="mgr-batt-スタート">-</td><td>-</td></tr>
                <tr><td>場所 1</td><td id="mgr-場所1">-</td><td id="mgr-batt-場所1">-</td><td id="mgr-action-場所1"></td></tr>
                <tr><td>場所 2</td><td id="mgr-場所2">-</td><td id="mgr-batt-場所2">-</td><td id="mgr-action-場所2"></td></tr>
                <tr><td>場所 3</td><td id="mgr-場所3">-</td><td id="mgr-batt-場所3">-</td><td id="mgr-action-場所3"></td></tr>
                <tr><td>場所 4</td><td id="mgr-場所4">-</td><td id="mgr-batt-場所4">-</td><td id="mgr-action-場所4"></td></tr>
                <tr><td>出発信号</td><td id="mgr-出発信号">-</td><td id="mgr-batt-出発信号">-</td><td>-</td></tr>
                <tr><td>接近</td><td id="mgr-接近">-</td><td id="mgr-batt-接近">-</td><td>-</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Firebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyBZB8je1MsKFzgEShCKIZk0xB3zHzMgDAE",
            authDomain: "toin-fes-2-2.firebaseapp.com",
            databaseURL: "https://toin-fes-2-2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "toin-fes-2-2",
            storageBucket: "toin-fes-2-2.firebasestorage.app",
            messagingSenderId: "407209918308",
            appId: "1:407209918308:web:5c2ce9b1a90a55a8b24471",
            measurementId: "G-HSFCX7T9J2"
        };

        const MANAGER_PASSWORD_HASH = "6b9353877cc7295161c22ed3117dbb2826ca2bb49a63043974ee4aa785549573";

        async function sha256(plainText) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plainText);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        let database;
        let serverTimeOffset = 0;

        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            database.ref('.info/serverTimeOffset').on('value', snap => {
                serverTimeOffset = snap.val() || 0;
            });
        }

        let currentRole = null;
        let mySessionId = null;
        let allPlacesData = {};
        let isFirstLoad = true;
        let myBatteryLevel = null;

        const EXCLUDED_ROLES = ["受付", "スタート", "出発信号", "接近", "管理者"];

        // ==========================================
        // ★画面消灯（スリープ）防止機能
        // ==========================================
        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        console.log('画面消灯防止（Wake Lock）が解除されました');
                    });
                    console.log('画面消灯防止（Wake Lock）が有効になりました');
                } catch (err) {
                    console.error(`Wake Lock エラー: ${err.name}, ${err.message}`);
                }
            } else {
                console.warn('お使いのブラウザはScreen Wake Lock APIに対応していません。');
            }
        }

        // 端末がスリープから復帰したり、タブを切り替えて戻ってきた時に再取得する
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
        // ==========================================

        function getServerTime() { return Date.now() + serverTimeOffset; }

        function generateSessionId() {
            return Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        }

        // イースターエッグ
        const characters = ["Chino.png", "Chiya.png", "Cocoa.png", "Maya.png", "Megu.png", "Rize.png", "Syaro.png"];
        function changeEasterEgg() {
            const img = document.getElementById("easter-egg-img");
            const randomChar = characters[Math.floor(Math.random() * characters.length)];
            img.src = `Images/${randomChar}`;
            img.style.top = "0px"; 
            
            setTimeout(() => { img.style.top = "-85px"; }, 1500);
        }

        // バッテリー監視
        async function initBatteryStatus() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    
                    const updateBattery = () => {
                        myBatteryLevel = Math.floor(battery.level * 100);
                        if (currentRole && mySessionId) {
                            database.ref(`status/${currentRole}/battery`).set(myBatteryLevel);
                        }
                    };

                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                } catch (e) {
                    console.error("Battery API Error:", e);
                }
            } else {
                console.log("Battery API not supported on this browser.");
            }
        }

        async function startApp() {
            const selected = document.getElementById("role-select").value;
            if (!selected) { alert("役割を選択してください"); return; }
            if (!database) { alert("Firebaseの設定がされていません。"); return; }

            if (selected === "管理者") {
                const pass = prompt("管理者用パスワードを入力してください");
                if (!pass) return;
                const hash = await sha256(pass);
                if (hash !== MANAGER_PASSWORD_HASH) {
                    alert("パスワードが違います");
                    return;
                }
            }

            const snapshot = await database.ref(`status/${selected}`).once('value');
            const data = snapshot.val();
            
            if (data && data.sessionId) {
                const isAlive = (getServerTime() - data.lastSeen) < 15000;
                if (isAlive) {
                    alert(`「${selected}」は現在別の端末で使用されています。\n（15秒ほど待つか、管理者に追放してもらってください）`);
                    return;
                }
            }

            if (currentRole && currentRole !== selected) {
                database.ref(`status/${currentRole}`).remove();
                if (heartbeatInterval) clearInterval(heartbeatInterval);
            }

            currentRole = selected;
            mySessionId = generateSessionId();

            if (EXCLUDED_ROLES.includes(currentRole)) {
                await database.ref(`status/${currentRole}`).set({
                    sessionId: mySessionId,
                    lastSeen: getServerTime(),
                    battery: myBatteryLevel
                });
            } else {
                await database.ref(`status/${currentRole}`).set({
                    sessionId: mySessionId,
                    state: "準備中",
                    lastSeen: getServerTime(),
                    battery: myBatteryLevel
                });
            }

            proceedToMainScreen();
        }

        let heartbeatInterval;
        function proceedToMainScreen() {
            document.getElementById("screen-setup").classList.remove("active");
            document.getElementById("app-header").style.display = "flex";
            document.getElementById("header-role-name").innerText = currentRole;
            document.getElementById("btn-cancel-setup").style.display = "block";

            // ★ここで画面消灯防止をリクエスト
            requestWakeLock();

            document.querySelectorAll(".screen:not(#screen-setup)").forEach(el => el.classList.remove("active"));

            // ハートビート開始（10秒に1回 lastSeen を更新）
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (currentRole && mySessionId) {
                    database.ref(`status/${currentRole}`).update({ lastSeen: getServerTime() });
                }
            }, 10000);

            if (currentRole === "管理者") {
                document.getElementById("screen-manager").classList.add("active");
                setupManagerScreen();
            }
            else if (currentRole === "受付" || currentRole === "スタート") {
                document.getElementById("screen-admin").classList.add("active");
                setupAdminScreen();
            } 
            else if (currentRole === "出発信号" || currentRole === "接近") {
                document.getElementById("screen-signal").classList.add("active");
                setupSignalScreen();
            } 
            else {
                document.getElementById("screen-client").classList.add("active");
                setupClientScreen();
            }

            // 全体データの監視（1回だけ設定）
            if (isFirstLoad) {
                database.ref('status').on('value', (snapshot) => {
                    allPlacesData = snapshot.val() || {};
                    const currentTime = getServerTime();

                    // セッションが切れていないか確認
                    if (currentRole && allPlacesData[currentRole]) {
                        if (allPlacesData[currentRole].sessionId !== mySessionId) {
                            alert("別の端末がこの役割にログインしたか、管理者から追放されました。");
                            location.reload();
                            return;
                        }
                    }

                    // オフライン判定
                    for (const role in allPlacesData) {
                        const data = allPlacesData[role];
                        if (data.lastSeen && (currentTime - data.lastSeen > 20000)) {
                            allPlacesData[role].state = "未接続";
                        }
                    }

                    updateUI();
                });

                // 来客通知の監視
                database.ref('visitorTrigger').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.time) {
                        const age = getServerTime() - data.time;
                        if (age < 5000) {
                            showVisitorBanner();
                            changeEasterEgg(); // 来客時にイースターエッグ発動
                        }
                    }
                });

                isFirstLoad = false;
            } else {
                updateUI();
            }
        }

        function openSetup() {
            document.getElementById("screen-setup").classList.add("active");
        }

        function cancelSetup() {
            document.getElementById("screen-setup").classList.remove("active");
        }

        function showVisitorBanner() {
            const banner = document.getElementById("visitor-banner");
            banner.classList.add("active");
            
            setTimeout(() => {
                banner.classList.remove("active");
            }, 3000);
        }

        // === 各画面の初期化 ===

        function setupAdminScreen() {
            const actionSpace = document.getElementById("header-action-space");
            if (currentRole === "受付") {
                actionSpace.innerHTML = '<button class="btn-action-header" onclick="triggerVisitor()">来客を通知する</button>';
            } else if (currentRole === "スタート") {
                actionSpace.innerHTML = '<button class="btn-action-header" onclick="resetAllToPreparing()">すべて準備中に戻す</button>';
            } else {
                actionSpace.innerHTML = '';
            }

            const grid = document.getElementById("admin-grid-container");
            grid.innerHTML = "";
            const targets = ["場所1", "場所2", "場所3", "場所4", "出発信号", "接近"];
            
            targets.forEach(role => {
                const cell = document.createElement("div");
                cell.className = "status-cell";
                cell.id = `admin-cell-${role}`;
                
                cell.innerHTML = `
                    <div class="cell-header">
                        ${role}
                        <span id="admin-batt-${role}" class="battery-badge">--%</span>
                    </div>
                    <div class="cell-body" id="admin-body-${role}">未接続</div>
                `;
                grid.appendChild(cell);
            });
        }

        function setupClientScreen() {
            const actionSpace = document.getElementById("header-action-space");
            actionSpace.innerHTML = '';
            updateStatus('準備中');
        }

        function setupSignalScreen() {
            const actionSpace = document.getElementById("header-action-space");
            actionSpace.innerHTML = '';
        }

        function setupManagerScreen() {
            const actionSpace = document.getElementById("header-action-space");
            actionSpace.innerHTML = '';

            const evictTargets = ["場所1", "場所2", "場所3", "場所4"];
            evictTargets.forEach(role => {
                const td = document.getElementById(`mgr-action-${role}`);
                if(td) {
                    td.innerHTML = `<button class="btn-evict" onclick="evictRole('${role}')">追放(切断)</button>`;
                }
            });
        }

        // === アクション関数 ===

        function triggerVisitor() {
            if (confirm("来客を通知しますか？\n（全員の画面に数秒間「来客」と表示されます）")) {
                database.ref('visitorTrigger').set({ time: firebase.database.ServerValue.TIMESTAMP });
            }
        }

        function updateStatus(newState) {
            if (currentRole && !EXCLUDED_ROLES.includes(currentRole)) {
                database.ref(`status/${currentRole}/state`).set(newState);
            }
        }

        function resetAllToPreparing() {
            if (confirm("場所1〜4をすべて「準備中」に戻しますか？")) {
                const updates = {};
                ["場所1", "場所2", "場所3", "場所4"].forEach(role => {
                    if (allPlacesData[role] && allPlacesData[role].state !== "未接続") {
                        updates[`status/${role}/state`] = "準備中";
                    }
                });
                database.ref().update(updates);
            }
        }

        function evictRole(role) {
            if (confirm(`本当に「${role}」をシステムから追放（強制切断）しますか？\n端末がフリーズした時などに使用してください。`)) {
                database.ref(`status/${role}`).remove();
                alert(`「${role}」を追放しました。`);
            }
        }

        // === UI更新関数 ===

        function updateUI() {
            if (currentRole === "受付" || currentRole === "スタート") {
                const targets = ["場所1", "場所2", "場所3", "場所4"];
                let isEmergency = false;
                let isAllReady = true;

                targets.forEach(role => {
                    const data = allPlacesData[role] || {};
                    const state = data.state || "未接続";
                    const battery = data.battery;

                    const cell = document.getElementById(`admin-cell-${role}`);
                    const body = document.getElementById(`admin-body-${role}`);
                    const battBadge = document.getElementById(`admin-batt-${role}`);
                    
                    if (cell && body) {
                        cell.className = "status-cell";
                        body.innerText = state;

                        if (state === "非常") {
                            cell.classList.add("status-emergency", "border-red");
                            isEmergency = true;
                            isAllReady = false;
                        } else if (state === "準備中") {
                            body.className = "cell-body status-preparing";
                            isAllReady = false;
                        } else if (state === "準備完了") {
                            body.className = "cell-body status-ready";
                        } else {
                            body.className = "cell-body status-unconnected";
                            isAllReady = false;
                        }

                        // バッテリー表示
                        if (battBadge) {
                            if (battery !== undefined && state !== "未接続") {
                                battBadge.style.display = "block";
                                battBadge.innerText = `${battery}%`;
                                if (battery <= 20) {
                                    battBadge.classList.add("battery-low");
                                } else {
                                    battBadge.classList.remove("battery-low");
                                }
                            } else {
                                battBadge.style.display = "none";
                            }
                        }
                    }
                });

                // 出発信号・接近の表示更新（変数連動）
                ["出発信号", "接近"].forEach(role => {
                    const data = allPlacesData[role] || {};
                    const isConnected = data.state !== "未接続" && data.lastSeen;
                    const battery = data.battery;
                    
                    const cell = document.getElementById(`admin-cell-${role}`);
                    const body = document.getElementById(`admin-body-${role}`);
                    const battBadge = document.getElementById(`admin-batt-${role}`);
                    
                    if (cell && body) {
                        cell.className = "status-cell";
                        
                        if (isConnected) {
                            if (isEmergency) {
                                body.className = "cell-body status-emergency";
                                cell.classList.add("border-red");
                                body.innerText = "非常（点滅）";
                            } else if (isAllReady) {
                                body.className = "cell-body status-light-on";
                                body.innerText = "点灯（準備完了）";
                            } else {
                                body.className = "cell-body status-light-off";
                                body.innerText = "消灯（待機）";
                            }
                        } else {
                            body.className = "cell-body status-unconnected";
                            body.innerText = "未接続";
                        }

                        // バッテリー表示
                        if (battBadge) {
                            if (battery !== undefined && isConnected) {
                                battBadge.style.display = "block";
                                battBadge.innerText = `${battery}%`;
                                if (battery <= 20) {
                                    battBadge.classList.add("battery-low");
                                } else {
                                    battBadge.classList.remove("battery-low");
                                }
                            } else {
                                battBadge.style.display = "none";
                            }
                        }
                    }
                });

            } 
            else if (currentRole === "出発信号" || currentRole === "接近") {
                const targets = ["場所1", "場所2", "場所3", "場所4"];
                let isEmergency = false;
                let isAllReady = true;

                targets.forEach(role => {
                    const data = allPlacesData[role] || {};
                    const state = data.state || "未接続";
                    if (state === "非常") isEmergency = true;
                    if (state !== "準備完了") isAllReady = false;
                });

                const signalScreen = document.getElementById("screen-signal");
                signalScreen.className = "screen active";
                if (isEmergency) signalScreen.classList.add("emergency-blink");
                else if (isAllReady) signalScreen.classList.add("light-on");
            } 
            else if (currentRole === "管理者") {
                const allRoles = ["受付", "スタート", "場所1", "場所2", "場所3", "場所4", "出発信号", "接近"];
                
                let isEmergency = false;
                let isAllReady = true;

                allRoles.forEach(role => {
                    const data = allPlacesData[role] || {};
                    const isConnected = data.lastSeen && (getServerTime() - data.lastSeen <= 20000);
                    const state = isConnected ? (data.state || "接続中") : "未接続";
                    const battery = data.battery;

                    if (["場所1", "場所2", "場所3", "場所4"].includes(role)) {
                        if (state === "非常") isEmergency = true;
                        if (state !== "準備完了") isAllReady = false;
                    }

                    const td = document.getElementById(`mgr-${role}`);
                    const battTd = document.getElementById(`mgr-batt-${role}`);

                    if (td) {
                        if (["出発信号", "接近"].includes(role)) {
                            if (!isConnected) {
                                td.innerHTML = '<span class="box-light-off" style="width:80%; margin:0 auto;">未接続</span>';
                            } else if (isEmergency) {
                                td.innerHTML = '<span class="box-light-on" style="background-color:#ff0000; border-color:#ff0000; color:#fff; width:80%; margin:0 auto; animation:urgent-blink 0.8s infinite steps(1);">非常</span>';
                            } else if (isAllReady) {
                                td.innerHTML = '<span class="box-light-on" style="width:80%; margin:0 auto;">点灯</span>';
                            } else {
                                td.innerHTML = '<span class="box-light-off" style="width:80%; margin:0 auto;">消灯</span>';
                            }
                        } else {
                            if (state === "未接続") {
                                td.innerHTML = '<span class="mgr-badge mgr-badge-unconnected">未接続</span>';
                            } else if (state === "非常") {
                                td.innerHTML = '<span class="mgr-badge mgr-badge-emergency">非常</span>';
                            } else if (state === "準備完了") {
                                td.innerHTML = '<span class="mgr-badge mgr-badge-ready">準備完了</span>';
                            } else if (state === "準備中") {
                                td.innerHTML = '<span class="mgr-badge mgr-badge-preparing">準備中</span>';
                            } else {
                                td.innerHTML = '<span class="badge-blue">接続中</span>';
                            }
                        }
                    }

                    if (battTd) {
                        if (isConnected && battery !== undefined) {
                            const lowClass = battery <= 20 ? "battery-low" : "";
                            battTd.innerHTML = `<span class="mgr-battery-badge ${lowClass}">${battery}%</span>`;
                        } else {
                            battTd.innerHTML = `<span style="color:#666;">-</span>`;
                        }
                    }
                });
            }
            else {
                // 場所1〜4の画面更新
                const myData = allPlacesData[currentRole] || {};
                const myState = myData.state || "準備中";

                document.getElementById("btn-status-preparing").classList.remove("active");
                document.getElementById("btn-status-ready").classList.remove("active");
                document.getElementById("btn-status-emergency").classList.remove("active");

                if (myState === "準備中") document.getElementById("btn-status-preparing").classList.add("active");
                else if (myState === "準備完了") document.getElementById("btn-status-ready").classList.add("active");
                else if (myState === "非常") document.getElementById("btn-status-emergency").classList.add("active");
            }
        }

        window.onload = () => {
            initBatteryStatus();
        };

        // ページを閉じる・リロードする際にFirebaseからデータを削除
        window.addEventListener('beforeunload', () => {
            if (currentRole && mySessionId) {
                database.ref(`status/${currentRole}`).remove();
            }
        });

    </script>
</body>
</html>
