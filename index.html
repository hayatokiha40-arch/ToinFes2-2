<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桐陰祭136-2信号システム</title>
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="Images/Favicon.jpg" type="image/jpeg">

    <!-- キャッシュ対策付きで外部SDKを読み込み -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=1.0.0"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js?v=1.0.0"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- ヘッダー --- */
        .app-header {
            background-color: #1e1e1e;
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d2d;
            height: 70px;
            z-index: 10;
            position: relative;
        }
        .role-display { font-size: 18px; font-weight: bold; }
        .btn-change-role {
            background-color: #444444; color: #fff; border: none;
            padding: 8px 16px; font-size: 14px; border-radius: 6px; cursor: pointer;
        }
        .btn-change-role:hover { background-color: #666666; }

        /* --- イースターエッグ画像 --- */
        #easter-egg-img {
            position: absolute;
            top: -85px; 
            right: 100%; 
            margin-right: 12px;
            width: 70px;
            height: 70px; 
            object-fit: contain;
            transition: top 0.4s ease-out; 
            z-index: 20;
        }

        /* --- 通知用の横帯 --- */
        #visitor-banner {
            width: 100%;
            height: 0;
            background-color: #0033cc;
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 5px;
            transition: height 0.2s ease, padding 0.2s ease;
            overflow: hidden;
            border-bottom: 2px solid #002288;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #visitor-banner.active {
            height: 55px;
            padding: 5px 0;
        }

        /* --- 画面コンテナ --- */
        .screen {
            display: none; flex: 1; width: 100%; height: calc(100vh - 70px);
        }
        .screen.active { display: flex; }

        /* --- 1. セットアップ画面 --- */
        #screen-setup {
            flex-direction: column; justify-content: center; align-items: center;
            background: #121212; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 100;
        }
        .setup-box {
            background-color: #1e1e1e; padding: 50px; border-radius: 12px;
            text-align: center; border: 2px solid #333; width: 90%; max-width: 500px;
        }
        .setup-title { font-size: 24px; margin-bottom: 30px; }
        .custom-dropdown {
            width: 100%; padding: 15px; font-size: 20px;
            background-color: #2a2a2a; color: #fff; border: 2px solid #555;
            border-radius: 8px; margin-bottom: 30px; cursor: pointer;
        }
        .btn-start {
            width: 100%; background-color: #0066ff; color: #fff; border: none;
            padding: 15px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-start:hover { background-color: #0055cc; }
        .btn-cancel {
            width: 100%; background-color: #444; color: #fff; border: none;
            padding: 15px; font-size: 18px; border-radius: 8px; cursor: pointer;
            display: none;
        }
        .btn-cancel:hover { background-color: #666; }

        /* --- 2. 受付・スタート 監視画面 --- */
        #screen-admin { flex-direction: column; padding: 15px; }
        .admin-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr); gap: 15px; flex: 1;
        }
        .status-cell {
            border: 3px solid #333; border-radius: 10px; display: flex;
            flex-direction: column; overflow: hidden; background-color: #1a1a1a;
        }
        .status-cell.border-red { border-color: #ff0000 !important; }
        
        .cell-header {
            background-color: #000; padding: 8px 0; text-align: center;
            font-size: 20px; font-weight: bold; border-bottom: 2px solid #333;
            position: relative; /* バッテリーバッジの配置基準 */
        }
        .battery-badge {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            border: 2px solid #ffffff; border-radius: 4px; padding: 2px 6px;
            font-size: 14px; font-weight: bold; background-color: #000;
            line-height: 1; display: none; /* 初期は非表示 */
        }
        .battery-low {
            color: #ff3333 !important; border-color: #ff3333 !important;
        }

        .cell-body {
            flex: 1; display: flex; justify-content: center; align-items: center;
            font-size: 40px; font-weight: bold;
        }
        
        .status-unconnected { background-color: #2a2a2a; color: #666666; }
        .status-preparing { background-color: #ffffff; color: #000000; }
        .status-ready { background-color: #0033cc; color: #ffffff; }
        
        /* 信号用ステータス色 */
        .status-light-on { background-color: #ff865e; color: #000000; }
        .status-light-off { background-color: #1a1a1a; color: #888888; }
        
        .status-emergency { animation: urgent-blink 0.8s infinite steps(1); }
        @keyframes urgent-blink {
            0%, 75% { background-color: #ff0000; color: #ffffff; }
            75.1%, 100% { background-color: #330000; color: #666666; }
        }
        
        .btn-action-header {
            background-color: #00ff33; color: #000; border: none;
            padding: 10px 40px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer;
        }

        /* --- 3. クライアント（場所1〜4・スタート操作）画面 --- */
        #screen-client { 
            padding: 20px; gap: 20px; align-items: center; 
            height: calc(100vh - 70px); transition: height 0.2s ease;
        }
        #visitor-banner.active + #screen-client { height: calc(100vh - 125px); }
        
        .client-btn {
            flex: 1; height: 80%; border: 4px solid #444; border-radius: 15px;
            font-size: 42px; font-weight: bold; cursor: pointer; display: flex;
            justify-content: center; align-items: center; opacity: 0.3; transition: 0.2s;
        }
        .client-btn.btn-preparing { background-color: #222; border-color: #555; }
        .client-btn.btn-ready { background-color: #0044cc; border-color: #0066ff; }
        .client-btn.btn-emergency { background-color: #550000; border-color: #ff0000; color: #ffb3b3; opacity: 0.7; }
        
        .client-btn.btn-preparing.active { 
            opacity: 1; background-color: #ffffff !important; color: #000000 !important;
            transform: scale(1.02); border: 6px solid #ffcc00; box-shadow: 0 0 25px rgba(255,255,255,0.4); 
        }
        .client-btn.btn-emergency.active {
            opacity: 1; background-color: #ff0000 !important; border-color: #ffffff !important;
            color: #ffffff !important; box-shadow: 0 0 30px rgba(255,0,0,0.8);
        }
        .client-btn.active { opacity: 1; transform: scale(1.02); border-width: 6px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        /* --- 4. 信号画面（出発信号・接近）--- */
        #screen-signal {
            width: 100%; height: calc(100vh - 70px);
            background-color: #121212; transition: background-color 0.3s;
        }
        #screen-signal.light-on { background-color: #ff865e !important; }
        #screen-signal.emergency-blink { animation: urgent-blink 0.8s infinite steps(1); }

        /* --- 5. 管理者画面 --- */
        #screen-manager {
            padding: 30px; flex-direction: column; align-items: center; justify-content: flex-start;
            overflow-y: auto;
        }
        .manager-table {
            width: 100%; max-width: 900px; border-collapse: collapse; margin-top: 20px;
        }
        .manager-table th, .manager-table td {
            border: 2px solid #444; padding: 15px; text-align: center; font-size: 22px; font-weight: bold;
        }
        .manager-table th { background-color: #222; }
        .manager-table th:nth-child(1) { width: 35%; }
        .manager-table th:nth-child(2) { width: 45%; }
        .manager-table th:nth-child(3) { width: 20%; }
        .manager-table td { background-color: #1a1a1a; }
        
        .badge-blue { background-color: #0033cc; color: #fff; padding: 8px 20px; border-radius: 6px; display: inline-block; }
        
        /* 信号用バッジデザイン */
        .box-light-on { background-color: #ff865e; border: 2px solid #ff865e; color: #000; padding: 8px 0; border-radius: 6px; display: block; width: 100%; }
        .box-light-off { background-color: #121212; border: 2px solid #444; color: #888; padding: 8px 0; border-radius: 6px; display: block; width: 100%; }

        .mgr-badge { display: inline-block; padding: 8px 20px; border-radius: 6px; font-weight: bold; width: 80%; }
        .mgr-badge-preparing { background-color: #ffffff; color: #000000; }
        .mgr-badge-ready { background-color: #0033cc; color: #ffffff; }
        .mgr-badge-emergency { background-color: #ff0000; color: #ffffff; }
        .mgr-badge-unconnected { background-color: #2a2a2a; color: #666666; }

        /* 管理者用バッテリーバッジ */
        .mgr-battery-badge {
            display: inline-block;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: #000;
        }
        .mgr-battery-badge.battery-low {
            color: #ff3333;
            border-color: #ff3333;
        }

    </style>
</head>
<body>

    <!-- 役割選択画面 -->
    <div id="screen-setup" class="screen active">
        <div class="setup-box">
            <h1 class="setup-title">端末の役割を設定してください</h1>
            <select id="role-select" class="custom-dropdown">
                <option value="">-- 選択してください --</option>
                <option value="受付">受付</option>
                <option value="スタート">スタート</option>
                <option value="場所1">場所 1</option>
                <option value="場所2">場所 2</option>
                <option value="場所3">場所 3</option>
                <option value="場所4">場所 4</option>
                <option value="出発信号">出発信号</option>
                <option value="接近">接近</option>
                <option value="管理者">《管理者》</option>
            </select>
            <button class="btn-start" onclick="startApp()">この役割で開始する</button>
            <button id="btn-cancel-setup" class="btn-cancel" onclick="cancelSetup()">キャンセル</button>
        </div>
    </div>

    <!-- ヘッダー -->
    <div class="app-header" id="app-header" style="display: none;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="Images/Favicon.jpg" alt="Icon" style="height: 40px; width: 40px; border-radius: 6px;">
            <div>
                <span style="color:#aaa; font-size:14px;">現在の役割: </span>
                <span id="header-role-name" class="role-display">未設定</span>
            </div>
        </div>

        <div id="header-action-space" style="flex: 1; display: flex; justify-content: center;"></div>
        
        <div style="position: relative; display: flex; align-items: center; height: 100%;">
            <img id="easter-egg-img" src="" alt="Secret Character">
            <button class="btn-change-role" onclick="openSetup()">役割を変更</button>
        </div>
    </div>

    <!-- 通知帯 -->
    <div id="visitor-banner">来客</div>

    <!-- 受付・スタート（監視）画面 -->
    <div id="screen-admin" class="screen">
        <div class="admin-grid" id="admin-grid-container">
            <!-- 動的生成 -->
        </div>
    </div>

    <!-- クライアント画面（場所1〜4・スタートボタン操作用） -->
    <div id="screen-client" class="screen">
        <div class="client-btn btn-preparing active" id="btn-status-preparing" onclick="updateStatus('準備中')">準備中</div>
        <div class="client-btn btn-ready" id="btn-status-ready" onclick="updateStatus('準備完了')">準備完了</div>
        <div class="client-btn btn-emergency" id="btn-status-emergency" onclick="updateStatus('非常')">非常</div>
    </div>

    <!-- 信号（出発信号・接近）画面 -->
    <div id="screen-signal" class="screen"></div>

    <!-- 管理者画面 -->
    <div id="screen-manager" class="screen">
        <h2 style="font-size:28px; margin-bottom:10px;">全体状況監視（管理者）</h2>
        <table class="manager-table">
            <thead>
                <tr><th>役割</th><th>現在の状態</th><th>バッテリ</th></tr>
            </thead>
            <tbody>
                <tr><td>受付</td><td id="mgr-受付">-</td><td id="mgr-batt-受付">-</td></tr>
                <tr><td>スタート</td><td id="mgr-スタート">-</td><td id="mgr-batt-スタート">-</td></tr>
                <tr><td>場所 1</td><td id="mgr-場所1">-</td><td id="mgr-batt-場所1">-</td></tr>
                <tr><td>場所 2</td><td id="mgr-場所2">-</td><td id="mgr-batt-場所2">-</td></tr>
                <tr><td>場所 3</td><td id="mgr-場所3">-</td><td id="mgr-batt-場所3">-</td></tr>
                <tr><td>場所 4</td><td id="mgr-場所4">-</td><td id="mgr-batt-場所4">-</td></tr>
                <tr><td>出発信号</td><td id="mgr-出発信号">-</td><td id="mgr-batt-出発信号">-</td></tr>
                <tr><td>接近</td><td id="mgr-接近">-</td><td id="mgr-batt-接近">-</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Firebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyBZB8je1MsKFzgEShCKIZk0xB3zHzMgDAE",
            authDomain: "toin-fes-2-2.firebaseapp.com",
            databaseURL: "https://toin-fes-2-2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "toin-fes-2-2",
            storageBucket: "toin-fes-2-2.firebasestorage.app",
            messagingSenderId: "407209918308",
            appId: "1:407209918308:web:5c2ce9b1a90a55a8b24471",
            measurementId: "G-HSFCX7T9J2"
        };

        const MANAGER_PASSWORD_HASH = "6b9353877cc7295161c22ed3117dbb2826ca2bb49a63043974ee4aa785549573";

        async function sha256(plainText) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plainText);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        let database;
        let serverTimeOffset = 0;

        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            database.ref('.info/serverTimeOffset').on('value', snap => {
                serverTimeOffset = snap.val() || 0;
            });
        }

        let currentRole = null;
        let mySessionId = null;
        let allPlacesData = {};
        let isFirstLoad = true;
        let heartbeatInterval = null;
        let systemBattery = null; // バッテリー残量保持用

        // バッテリーAPIの初期化（非対応端末では無視される）
        if (navigator.getBattery) {
            navigator.getBattery().then(batt => {
                systemBattery = Math.floor(batt.level * 100);
                batt.addEventListener('levelchange', () => {
                    systemBattery = Math.floor(batt.level * 100);
                });
            }).catch(e => console.log("Battery API Error", e));
        }

        // Firebaseリスナー参照
        let statusRef = null;
        let sessionRef = null;
        let guideEventRef = null;
        let startEventRef = null;
        let placesRef = null;
        let approachStateRef = null;

        function openSetup() {
            document.getElementById('screen-setup').style.display = 'flex';
            document.getElementById('btn-cancel-setup').style.display = currentRole ? 'block' : 'none';
        }

        function cancelSetup() {
            document.getElementById('screen-setup').style.display = 'none';
        }

        async function startApp() {
            const select = document.getElementById('role-select');
            const selectedRole = select.value;
            
            if (!selectedRole) {
                alert("役割を選択してください！");
                return;
            }

            if (selectedRole === '管理者') {
                const inputPwd = prompt("管理者パスワードを入力してください:");
                if (!inputPwd) return;
                const inputHash = await sha256(inputPwd);
                if (inputHash !== MANAGER_PASSWORD_HASH) {
                    alert("パスワードが誤っています。");
                    return;
                }
            }

            if (!database) {
                currentRole = selectedRole;
                proceedToMainScreen();
                return;
            }

            const newSessionId = Math.random().toString(36).substring(2, 15);

            if (selectedRole !== '受付' && selectedRole !== '管理者') {
                database.ref('places/' + selectedRole).once('value').then(snapshot => {
                    const data = snapshot.val();
                    
                    // 【修正】単にデータがあるかだけでなく、生存している（isDeviceConnected）かを判定する
                    if (data && isDeviceConnected(data) && selectedRole !== currentRole) {
                        if (!confirm(`${selectedRole} はすでに他の端末で使用されています。\n強制的にこの端末に切り替えますか？`)) return;
                    }
                    
                    clearListeners();
                    currentRole = selectedRole;
                    mySessionId = newSessionId;
                    
                    let initData = { 
                        session: mySessionId,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    };
                    if (systemBattery !== null) initData.battery = systemBattery;

                    if (['スタート', '場所1', '場所2', '場所3', '場所4'].includes(currentRole)) {
                        initData.status = '準備中';
                    }

                    database.ref('places/' + currentRole).update(initData).then(() => {
                        database.ref('places/' + currentRole + '/session').onDisconnect().remove();
                        if (initData.status) database.ref('places/' + currentRole + '/status').onDisconnect().remove();
                        proceedToMainScreen();
                    });
                });
            } else {
                clearListeners();
                currentRole = selectedRole;
                proceedToMainScreen();
            }
        }

        function proceedToMainScreen() {
            document.getElementById('screen-setup').style.display = 'none';
            document.getElementById('app-header').style.display = 'flex';
            document.getElementById('header-role-name').textContent = currentRole;
            
            document.querySelectorAll('.screen:not(#screen-setup)').forEach(s => s.classList.remove('active'));

            const headerSpace = document.getElementById('header-action-space');
            headerSpace.innerHTML = '';

            startHeartbeat();

            if (currentRole === '受付') {
                document.getElementById('screen-admin').classList.add('active');
                headerSpace.innerHTML = '<button class="btn-action-header" onclick="triggerGuide()">案内</button>';
                renderAdminGrid(['スタート', '場所1', '場所2', '場所3', '場所4']);
                setupAdminOrManager();
            } else if (currentRole === 'スタート') {
                document.getElementById('screen-admin').classList.add('active');
                document.getElementById('screen-client').classList.add('active');
                headerSpace.innerHTML = '<button class="btn-action-header" onclick="triggerStart()">スタート</button>';
                renderAdminGrid(['場所1', '場所2', '場所3', '場所4']);
                setupClient();
                setupAdminOrManager();
            } else if (['場所1', '場所2', '場所3', '場所4'].includes(currentRole)) {
                document.getElementById('screen-client').classList.add('active');
                setupClient();
            } else if (currentRole === '出発信号' || currentRole === '接近') {
                document.getElementById('screen-signal').classList.add('active');
                setupSignal();
            } else if (currentRole === '管理者') {
                document.getElementById('screen-manager').classList.add('active');
                setupAdminOrManager();
            }
        }

        function clearListeners() {
            stopHeartbeat();
            if (statusRef) { statusRef.off(); statusRef = null; }
            if (sessionRef) { sessionRef.off(); sessionRef = null; }
            if (guideEventRef) { guideEventRef.off(); guideEventRef = null; }
            if (startEventRef) { startEventRef.off(); startEventRef = null; }
            if (placesRef) { placesRef.off(); placesRef = null; }
            if (approachStateRef) { approachStateRef.off(); approachStateRef = null; }
        }

        function startHeartbeat() {
            stopHeartbeat();
            if (!database || !currentRole || currentRole === '管理者' || currentRole === '受付') return;

            sendHeartbeat();
            heartbeatInterval = setInterval(sendHeartbeat, 2000); // 2秒ごとに更新
        }

        function sendHeartbeat() {
            if (!database || !currentRole) return;
            const payload = { lastSeen: firebase.database.ServerValue.TIMESTAMP };
            if (systemBattery !== null) payload.battery = systemBattery; // ついでにバッテリーも送る
            database.ref(`places/${currentRole}`).update(payload);
        }

        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }

        function isDeviceConnected(placeData) {
            if (!placeData || !placeData.session || !placeData.lastSeen) return false;
            const estimatedServerNow = Date.now() + serverTimeOffset;
            const diff = estimatedServerNow - placeData.lastSeen;
            return diff < 5000;
        }

        function hasEmergencyStatus(places) {
            if (!places) return false;
            const targetPlaces = ['場所1', '場所2', '場所3', '場所4'];
            return targetPlaces.some(p => isDeviceConnected(places[p]) && places[p].status === '非常');
        }

        // 監視グリッドの生成（バッテリー表示枠を含む）
        function renderAdminGrid(keys) {
            const container = document.getElementById('admin-grid-container');
            container.innerHTML = '';
            
            container.style.gridTemplateColumns = 'repeat(3, 1fr)';
            container.style.gridTemplateRows = 'repeat(2, 1fr)';

            keys.forEach(key => {
                const isStart = (key === 'スタート');
                const borderClass = (currentRole === '受付' && isStart) ? 'border-red' : '';
                const html = `
                    <div class="status-cell ${borderClass}" id="cell-${key}">
                        <div class="cell-header">
                            ${key}
                            <div class="battery-badge" id="batt-${key}"></div>
                        </div>
                        <div class="cell-body status-unconnected" id="text-${key}">未接続</div>
                    </div>
                `;
                container.innerHTML += html;
            });

            // 受付画面の場合、右下の6マス目を2分割して「出発信号」と「接近」を配置
            if (currentRole === '受付') {
                container.innerHTML += `
                    <div class="status-cell" style="display: flex; flex-direction: row;">
                        <!-- 左半分：出発信号 -->
                        <div style="flex: 1; border-right: 3px solid #333; display: flex; flex-direction: column;">
                            <div class="cell-header" style="font-size: 16px;">
                                出発信号
                                <div class="battery-badge" id="batt-出発信号" style="right: 4px; padding: 1px 4px; font-size: 12px;"></div>
                            </div>
                            <div class="cell-body status-unconnected" id="text-出発信号" style="font-size: 26px;">未接続</div>
                        </div>
                        <!-- 右半分：接近 -->
                        <div style="flex: 1; display: flex; flex-direction: column;">
                            <div class="cell-header" style="font-size: 16px;">
                                接近
                                <div class="battery-badge" id="batt-接近" style="right: 4px; padding: 1px 4px; font-size: 12px;"></div>
                            </div>
                            <div class="cell-body status-unconnected" id="text-接近" style="font-size: 26px;">未接続</div>
                        </div>
                    </div>
                `;
            }
        }

        function updateBatteryDisplay(elementId, placeData) {
            const el = document.getElementById(elementId);
            if (!el) return;
            if (isDeviceConnected(placeData) && placeData.battery !== undefined) {
                el.textContent = placeData.battery + '%';
                el.style.display = 'block';
                if (placeData.battery <= 20) {
                    el.classList.add('battery-low');
                } else {
                    el.classList.remove('battery-low');
                }
            } else {
                el.style.display = 'none';
            }
        }

        function getManagerStatusBadge(status) {
            if (status === '準備中') return '<span class="mgr-badge mgr-badge-preparing">準備中</span>';
            if (status === '準備完了') return '<span class="mgr-badge mgr-badge-ready">準備完了</span>';
            if (status === '非常') return '<span class="mgr-badge mgr-badge-emergency">非常</span>';
            return '<span class="mgr-badge mgr-badge-unconnected">未接続</span>';
        }

        function setupAdminOrManager() {
            if (!database) return;
            statusRef = database.ref();
            statusRef.on('value', snapshot => {
                const val = snapshot.val() || {};
                const places = val.places || {};
                allPlacesData = places;

                const isEmergency = hasEmergencyStatus(places);
                const depSignal = checkDepartureSignal(places);
                const approachSignal = (val.approachState === 'active');

                // 通常の場所ステータス更新
                ['スタート', '場所1', '場所2', '場所3', '場所4'].forEach(key => {
                    const cellBody = document.getElementById('text-' + key);
                    if (cellBody) {
                        const isConnected = isDeviceConnected(places[key]);
                        const status = isConnected ? places[key].status : '未接続';
                        cellBody.textContent = status;
                        cellBody.className = 'cell-body';
                        if (status === '未接続') cellBody.classList.add('status-unconnected');
                        else if (status === '準備中') cellBody.classList.add('status-preparing');
                        else if (status === '準備完了') cellBody.classList.add('status-ready');
                        else if (status === '非常') cellBody.classList.add('status-emergency');
                    }
                    updateBatteryDisplay('batt-' + key, places[key]);
                });

                // 受付画面の 6マス目（信号ステータス）更新
                if (currentRole === '受付') {
                    const updateSignalCell = (key, isConn, isOn) => {
                        const el = document.getElementById('text-' + key);
                        if (!el) return;
                        el.className = 'cell-body';
                        if (!isConn) {
                            el.textContent = '未接続';
                            el.classList.add('status-unconnected');
                        } else if (isEmergency) {
                            el.textContent = '非常';
                            el.classList.add('status-emergency');
                        } else if (isOn) {
                            el.textContent = '点灯';
                            el.classList.add('status-light-on');
                        } else {
                            el.textContent = '消灯';
                            el.classList.add('status-light-off');
                        }
                    };
                    
                    updateSignalCell('出発信号', isDeviceConnected(places['出発信号']), depSignal);
                    updateSignalCell('接近', isDeviceConnected(places['接近']), approachSignal);
                    updateBatteryDisplay('batt-出発信号', places['出発信号']);
                    updateBatteryDisplay('batt-接近', places['接近']);
                }

                // 管理者画面の更新
                if (currentRole === '管理者') {
                    const mgrGuide = document.getElementById('mgr-受付');
                    mgrGuide.innerHTML = (val.guideState === 'active') ? '<span class="badge-blue">案内</span>' : '';

                    const mgrStart = document.getElementById('mgr-スタート');
                    if (val.startState === 'active') {
                        mgrStart.innerHTML = '<span class="badge-blue">スタート</span>';
                    } else {
                        const isConnected = isDeviceConnected(places['スタート']);
                        const st = isConnected ? places['スタート'].status : '未接続';
                        mgrStart.innerHTML = getManagerStatusBadge(st);
                    }

                    ['場所1', '場所2', '場所3', '場所4'].forEach(p => {
                        const isConnected = isDeviceConnected(places[p]);
                        const st = isConnected ? places[p].status : '未接続';
                        document.getElementById('mgr-' + p).innerHTML = getManagerStatusBadge(st);
                    });

                    // 出発信号の表示（未接続対応）
                    const mgrDep = document.getElementById('mgr-出発信号');
                    if (!isDeviceConnected(places['出発信号'])) {
                        mgrDep.innerHTML = '<span class="mgr-badge mgr-badge-unconnected">未接続</span>';
                    } else if (isEmergency) {
                        mgrDep.innerHTML = '<span class="mgr-badge mgr-badge-emergency">非常</span>';
                    } else {
                        mgrDep.innerHTML = depSignal ? '<span class="box-light-on">点灯</span>' : '<span class="box-light-off">消灯</span>';
                    }

                    // 接近信号の表示（未接続対応）
                    const mgrApp = document.getElementById('mgr-接近');
                    if (!isDeviceConnected(places['接近'])) {
                        mgrApp.innerHTML = '<span class="mgr-badge mgr-badge-unconnected">未接続</span>';
                    } else if (isEmergency) {
                        mgrApp.innerHTML = '<span class="mgr-badge mgr-badge-emergency">非常</span>';
                    } else {
                        mgrApp.innerHTML = approachSignal ? '<span class="box-light-on">点灯</span>' : '<span class="box-light-off">消灯</span>';
                    }

                    // バッテリー情報の更新（管理者画面バッジ化）
                    ['スタート', '場所1', '場所2', '場所3', '場所4', '出発信号', '接近'].forEach(r => {
                        const battTd = document.getElementById('mgr-batt-' + r);
                        if (battTd) {
                            if (isDeviceConnected(places[r]) && places[r].battery !== undefined) {
                                const lowClass = (places[r].battery <= 20) ? ' battery-low' : '';
                                battTd.innerHTML = `<span class="mgr-battery-badge${lowClass}">${places[r].battery}%</span>`;
                            } else {
                                battTd.innerHTML = '<span style="color:#666;">-</span>';
                            }
                        }
                    });
                }
            });
        }

        function checkDepartureSignal(places) {
            const targetPlaces = ['場所1', '場所2', '場所3', '場所4'];
            let connectedCount = 0;
            let readyCount = 0;

            targetPlaces.forEach(p => {
                if (isDeviceConnected(places[p])) {
                    connectedCount++;
                    if (places[p].status === '準備完了') readyCount++;
                }
            });

            return (connectedCount > 0 && connectedCount === readyCount);
        }

        function triggerGuide() {
            const startData = allPlacesData['スタート'];
            const startStatus = isDeviceConnected(startData) ? startData.status : '未接続';

            if (startStatus === '準備中') {
                if (!confirm("スタート地点が準備中です。よろしいですか。")) return;
            } else if (startStatus === '非常') {
                if (!confirm("スタート地点が非常です。本当によろしいですか。")) return;
            }

            if (!database) return;
            database.ref().update({
                'guideEvent': firebase.database.ServerValue.TIMESTAMP,
                'guideState': 'active',
                'approachState': 'off'
            });
        }

        function triggerStart() {
            let hasPreparing = false;
            let hasEmergency = false;

            ['場所1', '場所2', '場所3', '場所4'].forEach(p => {
                if (isDeviceConnected(allPlacesData[p])) {
                    if (allPlacesData[p].status === '準備中') hasPreparing = true;
                    if (allPlacesData[p].status === '非常') hasEmergency = true;
                }
            });

            if (hasEmergency) {
                if (!confirm("非常の場所があります。よろしいですか。")) return;
            } else if (hasPreparing) {
                if (!confirm("準備中の場所があります。よろしいですか。")) return;
            }

            if (!database) return;
            database.ref().update({
                'startEvent': firebase.database.ServerValue.TIMESTAMP,
                'startState': 'active',
                'approachState': 'active',
                'guideState': 'off'
            });
        }

        function setupClient() {
            if (!database) return;
            isFirstLoad = true;

            statusRef = database.ref(`places/${currentRole}/status`);
            statusRef.on('value', snapshot => {
                const status = snapshot.val() || '準備中';
                document.querySelectorAll('.client-btn').forEach(b => b.classList.remove('active'));
                if (status === '準備中') document.getElementById('btn-status-preparing').classList.add('active');
                else if (status === '準備完了') document.getElementById('btn-status-ready').classList.add('active');
                else if (status === '非常') document.getElementById('btn-status-emergency').classList.add('active');
            });

            sessionRef = database.ref(`places/${currentRole}/session`);
            sessionRef.on('value', snapshot => {
                const sId = snapshot.val();
                if (sId && sId !== mySessionId) {
                    alert("別の端末がこの役割を選択したため、切断されました。");
                    currentRole = null;
                    stopHeartbeat();
                    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                    document.getElementById('app-header').style.display = 'none';
                    openSetup();
                }
            });

            if (currentRole === 'スタート') {
                guideEventRef = database.ref('guideEvent');
                guideEventRef.on('value', snapshot => {
                    if (isFirstLoad) return;
                    showBanner('来客', 10000, null);
                });
            }

            startEventRef = database.ref('startEvent');
            startEventRef.on('value', snapshot => {
                if (isFirstLoad) { isFirstLoad = false; return; }
                showBanner('スタート', 20000, () => {
                    updateStatus('準備中');
                    if (currentRole === 'スタート') {
                        database.ref('startState').set('off');
                    }
                });
            });
        }

        function showBanner(text, durationMs, onComplete) {
            const allowedRoles = ['スタート', '場所1', '場所2', '場所3', '場所4'];
            if (!allowedRoles.includes(currentRole)) return;

            const banner = document.getElementById('visitor-banner');
            banner.textContent = text;
            banner.classList.add('active');
            
            setTimeout(() => {
                banner.classList.remove('active');
                if (onComplete) onComplete();
            }, durationMs);
        }

        function updateStatus(newStatus) {
            if (!database || !currentRole) return;
            database.ref(`places/${currentRole}`).update({ status: newStatus });
        }

        function setupSignal() {
            if (!database) return;
            const signalScreen = document.getElementById('screen-signal');

            if (currentRole === '出発信号') {
                placesRef = database.ref('places');
                placesRef.on('value', snapshot => {
                    const places = snapshot.val() || {};
                    const isEmergency = hasEmergencyStatus(places);

                    if (isEmergency) {
                        signalScreen.classList.remove('light-on');
                        signalScreen.classList.add('emergency-blink');
                    } else {
                        signalScreen.classList.remove('emergency-blink');
                        const isLightOn = checkDepartureSignal(places);
                        if (isLightOn) signalScreen.classList.add('light-on');
                        else signalScreen.classList.remove('light-on');
                    }
                });
            } else if (currentRole === '接近') {
                statusRef = database.ref();
                statusRef.on('value', snapshot => {
                    const val = snapshot.val() || {};
                    const places = val.places || {};
                    const approachState = val.approachState;
                    const isEmergency = hasEmergencyStatus(places);

                    if (isEmergency) {
                        signalScreen.classList.remove('light-on');
                        signalScreen.classList.add('emergency-blink');
                    } else {
                        signalScreen.classList.remove('emergency-blink');
                        if (approachState === 'active') signalScreen.classList.add('light-on');
                        else signalScreen.classList.remove('light-on');
                    }
                });
            }
        }

        // ==========================================
        // コナミコマンド（イースターエッグ）処理
        // ==========================================
        const konamiCode = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
        let konamiIndex = 0;
        let konamiTimer = null;
        let isEasterEggPlaying = false; 

        document.addEventListener('keydown', (e) => {
            if (currentRole !== '管理者' && currentRole !== '受付') {
                konamiIndex = 0;
                return;
            }
            
            if (isEasterEggPlaying) return;

            const key = e.key.toLowerCase();
            
            if (key === konamiCode[konamiIndex]) {
                if (konamiIndex === 0) {
                    clearTimeout(konamiTimer);
                    konamiTimer = setTimeout(() => {
                        konamiIndex = 0;
                    }, 5000);
                }
                
                konamiIndex++;
                
                if (konamiIndex === konamiCode.length) {
                    clearTimeout(konamiTimer);
                    konamiIndex = 0;
                    triggerEasterEgg();
                }
            } else {
                konamiIndex = 0;
                clearTimeout(konamiTimer);
                
                if (key === konamiCode[0]) {
                    konamiIndex = 1;
                    konamiTimer = setTimeout(() => {
                        konamiIndex = 0;
                    }, 5000);
                }
            }
        });

        function triggerEasterEgg() {
            isEasterEggPlaying = true;
            
            const characters = [
                'Images/Character1.png', 
                'Images/Character2.png', 
                'Images/Character3.png', 
                'Images/Character4.png'
            ];
            const randomChar = characters[Math.floor(Math.random() * characters.length)];
            const eggImg = document.getElementById('easter-egg-img');
            
            eggImg.onload = () => {
                eggImg.style.top = '-15px';
                
                setTimeout(() => {
                    eggImg.style.top = '-85px';
                    
                    setTimeout(() => {
                        isEasterEggPlaying = false;
                    }, 400);
                    
                }, 5000);
                
                eggImg.onload = null;
            };
            
            eggImg.src = randomChar;
        }
    </script>
</body>
</html>
